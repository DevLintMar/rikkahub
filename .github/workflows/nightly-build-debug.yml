name: Nightly Debug Build

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare signing key
        run: |
          set -eu
          if [ -z "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "DEBUG_KEYSTORE_BASE64 secret 未配置，拒绝构建（避免产出换签名的包）"
            exit 1
          fi
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > app/debug.keystore
          keytool -list -v -keystore app/debug.keystore -storepass android 2>/dev/null | grep -E 'Alias name|SHA256:' || true

      - name: Prepare build files
        run: |
          cat > local.properties << 'PROPERTIES'
          android.useAndroidX=true
          android.enableJetifier=false
          debug.storeFile=debug.keystore
          debug.storePassword=android
          debug.keyAlias=debug
          debug.keyPassword=android
          PROPERTIES
          echo '{"project_info":{"project_number":"0","project_id":"nightly-debug"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0000000000000000","android_client_info":{"package_name":"xyz.lynsei.rikkahub.debug"}},"oauth_client":[],"api_key":[{"current_key":""}]}]}' > app/google-services.json

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew app:assembleDebug

      - name: Unit Tests
        run: |
          ./gradlew :app:testDebugUnitTest

      - name: Upload Room schema JSON
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

      - name: Point tag at this build's commit
        run: |
          git tag -f nightly-debug
          git push -f origin refs/tags/nightly-debug

      - name: Publish nightly debug prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly-debug
          name: Nightly Debug Build
          prerelease: true
          make_latest: 'false'
          body: |
            自动每日构建（Debug，commit `${{ github.sha }}`）

            > Debug 构建，使用固定的独立签名密钥。
          files: app/build/outputs/apk/debug/*.apk
