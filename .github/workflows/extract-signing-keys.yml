name: Extract signing keys (one-shot)

# 一次性工具：三条 nightly 工作流的签名密钥只活在 actions/cache 里（缓存 7 天不被访问即被淘汰，
# 下次构建会静默 keytool -genkey 出一把新钥匙 → 签名漂移，已装用户无法覆盖安装）。
# 本工作流把三把密钥原样取出，用 secret KEY_PASSPHRASE 加密后上传为 artifact（retention 1 天），
# 供导出来固定进 repo secrets。取出后本文件即删除，不做任何构建。

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      KEY_PASSPHRASE: ${{ secrets.KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore release keystore
        uses: actions/cache/restore@v4
        with:
          path: app/release.keystore
          key: nightly-release-keystore-v1
          fail-on-cache-miss: true

      - name: Restore debug keystore
        uses: actions/cache/restore@v4
        with:
          path: app/debug.keystore
          key: nightly-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Restore pre keystore
        uses: actions/cache/restore@v4
        with:
          path: app/pre.keystore
          key: nightly-pre-keystore-v1
          fail-on-cache-miss: true

      - name: Print fingerprints and encrypt
        run: |
          set -eu
          test -n "${KEY_PASSPHRASE:-}" || { echo "KEY_PASSPHRASE secret is not set"; exit 1; }
          for n in release debug pre; do
            f="app/$n.keystore"
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
            echo "--- $n ---"
            keytool -list -v -keystore "$f" -storepass android 2>/dev/null \
              | grep -E 'Alias name|Valid from|SHA256:' || true
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$f" -out "$n.keystore.enc" -pass env:KEY_PASSPHRASE
          done
          ls -l *.keystore.enc

      - name: Upload encrypted keys
        uses: actions/upload-artifact@v4
        with:
          name: signing-keys-encrypted
          path: "*.keystore.enc"
          retention-days: 1
