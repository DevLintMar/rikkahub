name: Temporary Fetch Signing Key

on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: 'Temporary encryption passphrase'
        required: true
        type: string

jobs:
  export-key:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt and package keystore
        run: |
          set -eu
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Secret not found"
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass "pass:${{ inputs.passphrase }}" -in release.keystore -out release.keystore.enc
          rm -f release.keystore
          echo "Encrypted successfully"

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-enc
          path: release.keystore.enc
          retention-days: 1
